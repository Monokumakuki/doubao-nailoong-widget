<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥豆插件</title><link rel="stylesheet" href="styles.css"></head>
<body><main id="app" class="widget-container">
<section id="bubble" class="bubble hidden" aria-label="豆包思考泡"><h1 id="bubble-title">豆包额度</h1><button id="bubble-close" aria-label="收起气泡">×</button><div id="bubble-content"></div><nav class="bubble-nav"><button id="bubble-prev" aria-label="上一页">‹</button><span id="bubble-indicator">1 / 3</span><button id="bubble-next" aria-label="下一页">›</button></nav></section>
<div id="character" class="character" role="button" tabindex="0" aria-label="豆包：点击展开，拖动移动，右键设置"></div>
<div class="widget-tools"><button id="toggle-bubble" aria-label="显示气泡" title="显示气泡">•••</button><button id="refresh" aria-label="刷新额度" title="刷新额度">↻</button><button id="pet" aria-label="摸摸头" title="摸摸头">♡</button><button id="settings" aria-label="设置" title="设置">⚙</button><button id="switch-form" aria-label="切换形态" title="切换豆包 / 豆奶">⇄</button></div>
<div id="caption" hidden aria-live="polite"></div>
</main><script src="../domain/character-renderer.js"></script><script src="../domain/bubble-ui.js"></script><script src="renderer.js"></script></body></html>
